name: Vite Docker CI/CD

on:
  push:
    branches: [main]

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/vite-ci-test:latest .
        working-directory: dockerproject

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/vite-ci-test:latest
